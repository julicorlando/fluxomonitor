name: GesTi Helpdesk Tests
on:
  push:
    branches: [fix/gesti-master-inbox-lid-20261026]
  pull_request:
    paths:
      - 'helpdesk/**'
      - 'config/**'
      - 'flow/**'
      - 'requirements.txt'
      - '.github/workflows/gesti-helpdesk-tests.yml'
jobs:
  helpdesk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py test helpdesk
        env:
          SECRET_KEY: ci-only-not-production
