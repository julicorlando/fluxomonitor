services:
  mqtt:
    build: ./mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_IP:-10.0.0.147}:1883:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-fluxo}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Configure MQTT_PASSWORD}
    volumes:
      - fluxo_mqtt:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t fluxomonitor/health -m ok -q 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8086:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment: &env
      PFC_POLL_SECONDS: ${PFC_POLL_SECONDS:-3}
      PFC_SERVICE_SECRET: ${PFC_SERVICE_SECRET:?Configure PFC_SERVICE_SECRET}
      PFC_PULL_IPS: ${PFC_PULL_IPS:-192.168.1.235}
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?Configure WAHA_API_KEY}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      NETCONTROL_ROUTER1_PASSWORD: ${NETCONTROL_ROUTER1_PASSWORD:-}
      DATABASE_URL: postgres://fluxo:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/fluxo
      ALLOWED_HOSTS: fluxo.axionwebdigital.com.br,10.0.0.147,localhost,127.0.0.1,web,helpdesk.shoppingcarpina.com.br
      CSRF_TRUSTED_ORIGINS: https://fluxo.axionwebdigital.com.br,https://helpdesk.shoppingcarpina.com.br
    volumes:
      - fluxo_inventory:/app/private_media
    depends_on:
      db:
        condition: service_healthy
  collector:
    build: .
    restart: unless-stopped
    environment: &collector_env
      <<: *env
      PFC_SERVICE_SECRET: ${PFC_SERVICE_SECRET:?Configure PFC_SERVICE_SECRET}
      PFC_PULL_IPS: ${PFC_PULL_IPS:-192.168.1.235}
      PFC_POLL_SECONDS: ${PFC_POLL_SECONDS:-3}
      PFC_HISTORY_PAUSE_SECONDS: ${PFC_HISTORY_PAUSE_SECONDS:-1}
    command: ["python", "manage.py", "poll_pfc"]
    depends_on:
      web:
        condition: service_healthy
  netcontrol_collector:
    build: .
    restart: unless-stopped
    environment:
      <<: *env
      CRED_SG2: ${CRED_SG2:-}
    command: ["/bin/sh", "-c", "while true; do python manage.py poll_network; sleep 120; done"]
    depends_on:
      web:
        condition: service_healthy
  history:
    build: .
    restart: unless-stopped
    environment: *collector_env
    command: ["python", "manage.py", "import_pfc_history"]
    depends_on:
      web:
        condition: service_healthy
  closer:
    build: .
    restart: unless-stopped
    environment: *env
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do python manage.py close_days; sleep 60; done"]
    depends_on:
      web:
        condition: service_healthy
  notifier:
    build: .
    restart: unless-stopped
    environment: *env
    command: ["python", "manage.py", "monitor_system"]
    depends_on:
      web:
        condition: service_healthy
  support:
    build: .
    restart: unless-stopped
    environment: *env
    command: ["python", "manage.py", "run_support_bot"]
    depends_on:
      web:
        condition: service_healthy
  backup:
    build: ./backup
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: fluxo
      PGDATABASE: fluxo
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
    volumes:
      - fluxo_backups:/backups
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Configure WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
    volumes:
      - fluxo_whatsapp:/app/.sessions
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_DB: fluxo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - fluxo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo"]
      interval: 5s
      retries: 10
volumes:
  fluxo_mqtt:
  fluxo_db:
  fluxo_whatsapp:
  fluxo_backups:
  fluxo_inventory:
