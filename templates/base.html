<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GesTi · Gestão de fluxo</title><style>:root{color-scheme:dark;--bg:#0b1322;--card:#142139;--fg:#e7efff;--line:#2d4160}html.light{color-scheme:light;--bg:#f3f6fa;--card:white;--fg:#16253b;--line:#c4cfdd}body{background:var(--bg);color:var(--fg);font:15px system-ui;margin:0}main{max-width:1250px;margin:auto;padding:24px}nav{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:28px}a{color:inherit}button,.button{padding:10px 16px;background:#37b997;color:#081c18;border:0;border-radius:8px;cursor:pointer}input,select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}label{display:block;margin:12px 0}article,form.box{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:16px 0}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{opacity:.75}.scroll{overflow:auto}.warning{color:#dd9a39}@media print{nav,form,.noprint{display:none}body{background:white;color:black}main{padding:0}article{break-inside:avoid}td,th{font-size:10px;padding:6px}}</style>{% include "ui_styles.html" %}</head><body>{% include "navigation.html" %}<main>{% block content %}{% endblock %}</main><script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')</script></body></html>
