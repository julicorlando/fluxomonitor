<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axion • Fluxo</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1322;color:#e7efff;font:15px system-ui}main{max-width:1300px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:32px;margin:6px 0}p{color:#95a9c9}.tag{color:#58deb4;font-size:12px;letter-spacing:2px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,button,a.button{background:#1a2b44;color:#e7efff;border:1px solid #2d4160;padding:10px 14px;border-radius:10px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.card,.panel{background:#142139;border:1px solid #243753;border-radius:18px;padding:22px}.number{font-size:38px;font-weight:700;margin-top:14px}.label{color:#a6b8d3}.cameras{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.row{display:flex;justify-content:space-between;margin:14px 0}.status{color:#5de4be}.offline{color:#ffb269}.chart{display:flex;align-items:end;gap:3px;height:170px;margin-top:24px}.bar{flex:1;background:#5de4be;min-height:2px;border-radius:3px 3px 0 0}.axis{display:flex;justify-content:space-between;color:#95a9c9;margin-top:10px}#notice{color:#ffcc89;white-space:pre-line}footer{margin-top:28px;color:#95a9c9}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cameras{grid-template-columns:1fr}main{padding:18px}.number{font-size:30px}}</style></head><body><main><header><div><span class="tag">AXION WEB DIGITAL</span><h1>Movimento em perspectiva</h1><p>Três câmeras. Uma visão completa do fluxo.</p></div><div class="controls"><input id="day" type="date" aria-label="Data"><a id="export" class="button">Exportar CSV</a><a href="/admin/" class="button">Gestão</a><form action="/logout/" method="post">{% csrf_token %}<button>Sair</button></form></div></header><div class="grid"><div class="card"><span class="label">Entradas</span><div class="number" id="entries">—</div></div><div class="card"><span class="label">Saídas</span><div class="number" id="exits">—</div></div><div class="card"><span class="label">Saldo do dia · inicial 0</span><div class="number" id="balance">—</div></div><div class="card"><span class="label">Passagens · entradas + saídas</span><div class="number" id="passages">—</div></div></div><section class="panel"><div class="row"><strong>Fluxo a cada 15 minutos</strong><span id="peak">—</span></div><div id="chart" class="chart" role="img" aria-label="Gráfico de passagens por intervalo"></div><div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:45</span></div></section><section id="cameras" class="cameras"></section><p id="notice"></p><footer id="updated">Aguardando dados…</footer></main><script>
const day=document.getElementById('day');day.value=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo'}).format(new Date());const fmt=n=>new Intl.NumberFormat('pt-BR').format(n);function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}let busy=false;let autoToday=true;async function update(){if(busy)return;if(autoToday)day.value=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo'}).format(new Date());busy=true;try{const r=await fetch('/api/v1/live/?date='+day.value);if(!r.ok)throw Error('Não foi possível consultar. Verifique seu login.');const d=await r.json();for(const k of ['entries','exits','balance','passages'])document.getElementById(k).textContent=fmt(d.totals[k]);document.getElementById('peak').textContent='Pico: '+(d.peak_hour||'sem movimento');const cs=document.getElementById('cameras');cs.replaceChildren();for(const c of d.cameras){const card=el('article','','card');card.append(el('h2',c.name),el('span',c.online?'● Online':'● Sem sinal recente',c.online?'status':'offline'));for(const [label,k] of [['Entradas','entries'],['Saídas','exits'],['Saldo','balance']]){const row=el('div','','row');row.append(el('span',label),el('strong',fmt(c[k])));card.append(row)}card.append(el('p','Pico de 15 min: '+(c.peak_15min||'—')),el('small','Último contato: '+(c.last_seen?new Date(c.last_seen).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'nenhum')));cs.append(card)}const chart=document.getElementById('chart');chart.replaceChildren();const max=Math.max(1,...d.intervals.map(x=>x.passages));for(const b of d.intervals){const bar=el('div','','bar');bar.style.height=(b.passages/max*100)+'%';bar.title=b.time+' • '+b.passages+' passagens';chart.append(bar)}document.getElementById('notice').textContent=d.warnings.join('\n');document.getElementById('updated').textContent='Atualizado '+new Date(d.updated_at).toLocaleTimeString('pt-BR')+' • painel consulta a cada 5 s; frequência da câmera pode ser diferente. Saldo não equivale a visitantes únicos.';document.getElementById('export').href='/api/v1/export.csv?date='+day.value}catch(e){document.getElementById('notice').textContent=e.message}finally{busy=false}}day.addEventListener('change',()=>{autoToday=false;update()});update();setInterval(update,5000);
</script></body></html>
