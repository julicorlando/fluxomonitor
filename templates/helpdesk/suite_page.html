<p class="it-caption">Página {{ items.number }} de {{ items.paginator.num_pages }} · {{ items.paginator.count }} registros</p><div class="toolbar noprint">{% if items.has_previous %}<a href="?page={{ items.previous_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;company={{ request.GET.company|urlencode }}&amp;kind={{ request.GET.kind|urlencode }}">← Anterior</a>{% endif %}{% if items.has_next %}<a href="?page={{ items.next_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;company={{ request.GET.company|urlencode }}&amp;kind={{ request.GET.kind|urlencode }}">Próxima →</a>{% endif %}</div>
